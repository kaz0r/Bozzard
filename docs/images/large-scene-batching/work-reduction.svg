<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-labelledby="title desc">
<title id="title">Per-frame work, before and after</title>
<desc id="desc">Draw calls and exact projections, main or reference versus this pass, log scale. Sun shadow draws, 140k cubes: 825 to 2; Color draws, 140k cubes: 1,204 to 95; Color draws, 140k-quad arena check: 2,188 to 137; Shadow draws, sun + spot + point fixture: 328 to 23; Exact occluder projections, 4,096 cubes: 4,096 to 66</desc>
<style>.surface{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}
.main{fill:#8f8d86}.pass{fill:#2a78d6}.link{stroke:#c3c2b7;stroke-width:2}
.ring{stroke:#fcfcfb;stroke-width:2}
@media (prefers-color-scheme: dark){
.surface{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.muted{fill:#898781}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}.main{fill:#6f6d66}.pass{fill:#3987e5}
.link{stroke:#383835}.ring{stroke:#1a1a19}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.title{font-size:16px;font-weight:600}.subtitle{font-size:12px}
.label{font-size:12px}.value{font-size:11px;font-variant-numeric:tabular-nums}
.tick{font-size:11px;font-variant-numeric:tabular-nums}</style>
<rect class="surface" width="760" height="368" rx="8"/>
<text x="24.0" y="32.0" class="title ink" text-anchor="start">Per-frame work, before → after</text>
<text x="24.0" y="52.0" class="subtitle ink2" text-anchor="start">Main or the reference path versus this pass · log scale · counts per frame</text>
<text x="679.0" y="36.0" class="label ink2" text-anchor="start">this pass</text>
<circle cx="670.0" cy="32.0" r="5" class="pass ring"/>
<text x="541.0" y="36.0" class="label ink2" text-anchor="start">main / reference</text>
<circle cx="532.0" cy="32.0" r="5" class="main ring"/>
<line x1="330.0" y1="84.0" x2="330.0" y2="312.0" class="grid"/>
<text x="330.0" y="330.0" class="tick muted" text-anchor="middle">1</text>
<line x1="427.5" y1="84.0" x2="427.5" y2="312.0" class="grid"/>
<text x="427.5" y="330.0" class="tick muted" text-anchor="middle">10</text>
<line x1="525.0" y1="84.0" x2="525.0" y2="312.0" class="grid"/>
<text x="525.0" y="330.0" class="tick muted" text-anchor="middle">100</text>
<line x1="622.5" y1="84.0" x2="622.5" y2="312.0" class="grid"/>
<text x="622.5" y="330.0" class="tick muted" text-anchor="middle">1,000</text>
<line x1="720.0" y1="84.0" x2="720.0" y2="312.0" class="grid"/>
<text x="720.0" y="330.0" class="tick muted" text-anchor="middle">10,000</text>
<text x="306.0" y="112.0" class="label ink" text-anchor="end">Sun shadow draws, 140k cubes</text>
<line x1="359.4" y1="108.0" x2="614.4" y2="108.0" class="link"/>
<circle cx="614.4" cy="108.0" r="5" class="main ring"/>
<circle cx="359.4" cy="108.0" r="5" class="pass ring"/>
<text x="624.4" y="112.0" class="value ink2" text-anchor="start">825</text>
<text x="349.4" y="112.0" class="value ink2" text-anchor="end">2</text>
<text x="306.0" y="156.0" class="label ink" text-anchor="end">Color draws, 140k cubes</text>
<line x1="522.8" y1="152.0" x2="630.4" y2="152.0" class="link"/>
<circle cx="630.4" cy="152.0" r="5" class="main ring"/>
<circle cx="522.8" cy="152.0" r="5" class="pass ring"/>
<text x="640.4" y="156.0" class="value ink2" text-anchor="start">1,204</text>
<text x="512.8" y="156.0" class="value ink2" text-anchor="end">95</text>
<text x="306.0" y="200.0" class="label ink" text-anchor="end">Color draws, 140k-quad arena check</text>
<line x1="538.3" y1="196.0" x2="655.7" y2="196.0" class="link"/>
<circle cx="655.7" cy="196.0" r="5" class="main ring"/>
<circle cx="538.3" cy="196.0" r="5" class="pass ring"/>
<text x="665.7" y="200.0" class="value ink2" text-anchor="start">2,188</text>
<text x="528.3" y="200.0" class="value ink2" text-anchor="end">137</text>
<text x="306.0" y="244.0" class="label ink" text-anchor="end">Shadow draws, sun + spot + point fixture</text>
<line x1="462.8" y1="240.0" x2="575.3" y2="240.0" class="link"/>
<circle cx="575.3" cy="240.0" r="5" class="main ring"/>
<circle cx="462.8" cy="240.0" r="5" class="pass ring"/>
<text x="585.3" y="244.0" class="value ink2" text-anchor="start">328</text>
<text x="452.8" y="244.0" class="value ink2" text-anchor="end">23</text>
<text x="306.0" y="288.0" class="label ink" text-anchor="end">Exact occluder projections, 4,096 cubes</text>
<line x1="507.4" y1="284.0" x2="682.2" y2="284.0" class="link"/>
<circle cx="682.2" cy="284.0" r="5" class="main ring"/>
<circle cx="507.4" cy="284.0" r="5" class="pass ring"/>
<text x="692.2" y="288.0" class="value ink2" text-anchor="start">4,096</text>
<text x="497.4" y="288.0" class="value ink2" text-anchor="end">66</text>
<text x="24.0" y="354.0" class="subtitle muted" text-anchor="start">Sources: scale_shadow_benchmark and the exact-pixel tests in crates/bozzard-render/tests/submission.rs.</text>
</svg>
