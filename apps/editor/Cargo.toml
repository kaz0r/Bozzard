[package]
name = "bozzard-editor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../../tools/steam_build.rs"

[[bin]]
name = "bozzard-editor"
path = "src/main.rs"

[[bin]]
name = "bozz-torio-editor"
path = "src/factory_main.rs"
required-features = ["factory"]

[features]
default = ["steam"]
steam = ["bozzard-demo/steam", "bozzard-editor/steam"]
factory = ["dep:bozz-torio"]

[dependencies]
bozzard-diagnostics.workspace = true
bozzard-audio.workspace = true
bozzard-project = { path = "../../crates/bozzard-project" }
bozzard-editor = { path = "../../crates/bozzard-editor" }
bozzard-demo.workspace = true
bozz-torio = { path = "../bozz-torio", default-features = false, optional = true }
bozzard-scene.workspace = true
bozzard-assets.workspace = true
bozzard-render.workspace = true
bozzard-render-assets.workspace = true
anyhow.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
pollster.workspace = true
rfd = "0.17.2"
open = "5.4.4"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "wgpu", "default_fonts", "x11", "wayland", "persistence"] }

[lints]
workspace = true
