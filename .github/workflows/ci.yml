name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: Native / ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: vulkan
            software: --software
          - os: windows-2025
            backend: dx12
            software: --software
          - os: macos-15
            backend: metal
            software: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux graphics and window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxi-dev libasound2-dev xvfb
          mkdir -p "$RUNNER_TEMP/bozzard-xdg"
          chmod 700 "$RUNNER_TEMP/bozzard-xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/bozzard-xdg" >> "$GITHUB_ENV"
      - name: Install pinned toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Development package layout tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check headless dependency boundary
        run: python3 tools/check_headless.py
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Compile optional Steam multiplayer on each native target
        run: cargo clippy -p bozzard-network -p bozzard-player -p bozzard-editor-app --all-targets --features bozzard-player/steam,bozzard-editor-app/steam --locked --offline -- -D warnings
      - name: Compile the game-specific factory editor
        run: cargo clippy -p bozzard-editor-app --all-targets --features factory --locked --offline -- -D warnings
      - name: CPU and headless tests
        run: cargo test --workspace --locked --offline
      - name: Non-Steam editor error paths
        run: cargo test -p bozzard-editor --test multiplayer --no-default-features --locked --offline
      - name: Build native release executables
        run: |
          cargo build --release --locked --offline -p bozzard-player -p bozzard-server -p bozzard-editor-app
          cargo build --release --locked --offline -p bozzard-editor-app --features factory --bin bozz-torio-editor
      - name: Recreate the player GPU after a presented frame
        env:
          BACKEND: ${{ matrix.backend }}
          SOFTWARE: ${{ matrix.software }}
        run: |
          status=0
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            output=$(xvfb-run -a target/release/bozzard-player --scene examples/demo/scenes/first-trail.json --frames 3 --inject-device-recreation --backend "$BACKEND" $SOFTWARE 2>&1) || status=$?
          else
            output=$(target/release/bozzard-player --scene examples/demo/scenes/first-trail.json --frames 3 --inject-device-recreation --backend "$BACKEND" $SOFTWARE 2>&1) || status=$?
          fi
          printf '%s\n' "$output"
          if (( status != 0 )) || [[ "$output" != *device_recreation_ok* || "$output" != *window_ok* ]]; then
            detail=$output
            if (( ${#detail} > 3000 )); then
              detail=${detail: -3000}
            fi
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error title=Player device recreation smoke (exit %s)::%s\n' "$status" "$detail"
            exit 1
          fi
      - name: Package Bozz-torio and verify its relocated factory
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python3 apps/bozz-torio/tools/package.py --app-id 480 --out dist/bozz-torio --offline --verify
          else
            python3 apps/bozz-torio/tools/package.py --app-id 480 --out dist/bozz-torio --offline --verify
          fi
      - name: Verify the game-specific editor export path
        run: |
          target/release/bozz-torio --offline --scene apps/bozz-torio/scene/bozz-torio.json --export-dir dist/bozz-torio-editor-export
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python3 apps/bozz-torio/tools/package.py --verify-only --out dist/bozz-torio-editor-export
          else
            python3 apps/bozz-torio/tools/package.py --verify-only --out dist/bozz-torio-editor-export
          fi
      - name: Package and verify pixels from extracted executables
        env:
          BACKEND: ${{ matrix.backend }}
          SOFTWARE: ${{ matrix.software }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python3 tools/package.py --verify --window --editor-window --backend "$BACKEND" $SOFTWARE
          else
            python3 tools/package.py --verify --backend "$BACKEND" $SOFTWARE
          fi
      - name: Export First Trail and verify the relocated game
        env:
          BACKEND: ${{ matrix.backend }}
          SOFTWARE: ${{ matrix.software }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python3 tools/package.py --project examples/demo/first-trail.bozzard.json --export-dir dist/first-trail --verify --verify-first-trail --window --backend "$BACKEND" $SOFTWARE
          else
            python3 tools/package.py --project examples/demo/first-trail.bozzard.json --export-dir dist/first-trail --verify --verify-first-trail --backend "$BACKEND" $SOFTWARE
          fi
      - name: Export Flap Woods and verify its complete game loop
        env:
          BACKEND: ${{ matrix.backend }}
          SOFTWARE: ${{ matrix.software }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python3 tools/package.py --project examples/demo/flap-woods.bozzard.json --export-dir dist/flap-woods --verify --verify-flap-woods --window --backend "$BACKEND" $SOFTWARE
          else
            python3 tools/package.py --project examples/demo/flap-woods.bozzard.json --export-dir dist/flap-woods --verify --verify-flap-woods --backend "$BACKEND" $SOFTWARE
          fi
      # Both examples execute shipped shaders after relocation on each native backend.
      - name: Export compute examples and verify GPU output from relocated executables
        env:
          BACKEND: ${{ matrix.backend }}
          SOFTWARE: ${{ matrix.software }}
        run: |
          for example in compute-waves compute-numbers; do
            python3 tools/package.py --project "examples/demo/$example.bozzard.json" --export-dir "dist/$example" --verify --backend "$BACKEND" $SOFTWARE
          done
      - name: Upload pixel diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixels-${{ matrix.os }}
          path: |
            work/package-smoke/*.ppm
            work/editor-package-smoke/*.ppm
            work/export-package-smoke/*.ppm
          if-no-files-found: ignore
      - name: Upload native development bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bozzard-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
