[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "examples/demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
bozzard-ecs = { path = "crates/bozzard-ecs" }
bozzard-app = { path = "crates/bozzard-app" }
bozzard-render = { path = "crates/bozzard-render" }
bozzard-demo = { path = "examples/demo" }
bozzard-scene = { path = "crates/bozzard-scene" }
glam = "0.33.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
pollster = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
