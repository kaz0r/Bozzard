[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "examples/demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
bozzard-compute = { path = "crates/bozzard-compute" }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
bozzard-diagnostics = { path = "crates/bozzard-diagnostics" }
bozzard-text = { path = "crates/bozzard-text" }
bozzard-assets = { path = "crates/bozzard-assets" }
bozzard-audio = { path = "crates/bozzard-audio" }
kira = { version = "0.12.4", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tobj = { version = "4.0.4", default-features = false }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
base64 = "0.22"
bozzard-ecs = { path = "crates/bozzard-ecs" }
bozzard-app = { path = "crates/bozzard-app" }
bozzard-render = { path = "crates/bozzard-render" }
bozzard-render-assets = { path = "crates/bozzard-render-assets" }
bozzard-demo = { path = "examples/demo" }
bozzard-scene = { path = "crates/bozzard-scene" }
glam = "0.33.6"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"
pollster = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl", "counters"] }
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
